name: Build Action

on:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Installing Dependencies
        run: make deps
      - name: Running format
        run: make format
      - name: Checking uncommitted changes
        run: scripts/check-uncommitted.sh

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Running lint
        run: make lint
      - name: Checking uncommitted changes
        run: scripts/check-uncommitted.sh

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Running tests
        run: make test
      - name: Ensure build
        run: make build
      - name: Smoke test
        run: |
          ./build/chatops version
          ./build/chatops-mcp version
      - name: Checking uncommitted changes
        run: scripts/check-uncommitted.sh

  # Single required check for branch protection; always() so a failed job is not reported as skipped.
  build:
    runs-on: ubuntu-26.04
    needs: [format, lint, test]
    if: always()
    steps:
      - name: Checking job results
        run: |
          echo "format=${{ needs.format.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          test "${{ needs.format.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
