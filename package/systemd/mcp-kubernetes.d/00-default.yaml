# Settings for chatops-mcp's kubernetes tool group (serve --tool kubernetes --config <this directory>).
# Every field is optional:
#   kubeconfig:  kubeconfig file, honored exactly with no fallback; relative paths follow this directory. Omit to use
#                in-cluster credentials when running as a pod, else $KUBECONFIG or ~/.kube/config.
#   context:     kubeconfig context; forces kubeconfig-based resolution even in a pod.
#   max_results: row cap for every tool that returns rows: each *_list tool, and each target of a *_pods tool
#                (default 50); the total matched is still reported.
# Only *.yaml files in this directory are read, in file name order; put overrides in a file of your own (e.g.
# 10-site.yaml), where a field replaces the one here. A kubeconfig kept here must not be named *.yaml.
kubeconfig: /etc/chatops/kubeconfig
# context: homelab
max_results: 50
